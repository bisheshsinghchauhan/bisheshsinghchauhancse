<!-- vowel or consonent checker create a. js program that takes a chracter input uses ifelse condition to check if it is vowel or consonant display the result dynamically  -->

<!DOCTYPE html>
<html>
<body>
<button onclick="check()">Check Vowel or Consonant</button>
<p id="result"></p>
<script>
function check() {
    let ch = prompt("Enter a character:");
    if (ch == 'a' || ch == 'e' || ch == 'i' || ch == 'o' || ch == 'u' ||
        ch == 'A' || ch == 'E' || ch == 'I' || ch == 'O' || ch == 'U') {
        document.getElementById("result").innerHTML = ch + " is a Vowel";
    }
    else {
        document.getElementById("result").innerHTML = ch + " is a Consonant";
    }
}
</script>
</body>
</html>
